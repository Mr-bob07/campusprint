<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile – CampusPrint</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/dashboard-customer.css" />
</head>
<body class="page-wrapper" style="background-color: var(--color-bg-light);">

  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="dashboard-layout">

      <!-- Left Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div style="font-weight: 700; color: var(--color-primary); font-size: 0.95rem;">Student Portal</div>
          <div style="font-size: 0.75rem; color: var(--color-text-muted);">CampusPrint DIU</div>
        </div>
        <div class="sidebar-section-label">Main Menu</div>
        <a href="dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span><span>Dashboard Overview</span></a>
        <a href="place-order.html" class="sidebar-link"><span class="sidebar-link-icon">🖨️</span><span>Place New Order</span></a>
        <a href="track-order.html" class="sidebar-link"><span class="sidebar-link-icon">📍</span><span>Track Active Order</span></a>
        <a href="my-orders.html" class="sidebar-link"><span class="sidebar-link-icon">📦</span><span>My Orders History</span></a>
        <a href="my-rewards.html" class="sidebar-link"><span class="sidebar-link-icon">🎁</span><span>Bonus Points &amp; Rewards</span></a>
        <a href="favorite-shops.html" class="sidebar-link"><span class="sidebar-link-icon">❤️</span><span>Favorite Shops</span></a>
        <div class="sidebar-section-label" style="margin-top: 1.5rem;">Account</div>
        <a href="my-profile.html" class="sidebar-link active"><span class="sidebar-link-icon">👤</span><span>My Profile</span></a>
        <button class="sidebar-link" onclick="CampusPrint.auth.logout()" style="width:100%; text-align:left; background:none; border:none; cursor:pointer; color:var(--color-danger);"><span class="sidebar-link-icon">🚪</span><span>Logout</span></button>
      </aside>

      <!-- Right Content -->
      <div class="dashboard-content" style="max-width: 800px;">
        <div class="dashboard-header">
          <div>
            <h1 style="font-size: 1.75rem; color: var(--color-primary); margin-bottom: 0.25rem;">My Profile Settings</h1>
            <p>Update your personal information and campus delivery address</p>
          </div>
        </div>

        <div class="form-card">
          <form onsubmit="event.preventDefault(); CampusPrint.toast.success('Profile Updated!', 'Your contact information has been saved.');">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full Name <span class="required">*</span></label>
                <input type="text" class="form-input" value="Tanzim Ahmed" required />
              </div>
              <div class="form-group">
                <label class="form-label">Phone Number <span class="required">*</span></label>
                <input type="tel" class="form-input" value="01712345678" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address <span class="required">*</span></label>
              <input type="email" class="form-input" value="student@diu.edu.bd" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">University Name</label>
                <input type="text" class="form-input" value="Daffodil International University (DIU)" disabled />
              </div>
              <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" class="form-input" value="Computer Science & Engineering" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Default Hostel / Campus Delivery Address</label>
              <input type="text" class="form-input" value="DSC Hall 3, Room 402, Daffodil Smart City, Ashulia" />
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Save Profile Changes</button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../../js/utils/auth.js"></script>
  <script src="../../js/components/navbar.js?v=20261121_2"></script>
  <script src="../../js/components/footer.js"></script>
</body>
</html>
